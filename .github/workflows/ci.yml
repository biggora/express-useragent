name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20.19, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:vitest

      - name: Build
        run: npm run build

      - name: Upload Node 18 runtime artifact
        if: matrix.node == 20.19
        uses: actions/upload-artifact@v4
        with:
          name: node18-runtime-dist
          path: dist
          if-no-files-found: error

  node18-runtime-smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: node18-runtime-dist
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 18

      - name: Smoke runtime on Node 18
        run: |
          node --input-type=module -e "await import('./dist/index.mjs'); console.log('esm-ok')"
          node -e "require('./dist/index.cjs'); console.log('cjs-ok')"
